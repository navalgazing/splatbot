name: RunPod Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.runpod
      - .github/workflows/runpod-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: ghcr.io/navalgazing/splatbot-runpod:latest
