name: RunPod Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.runpod
      - .github/workflows/runpod-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          df -h
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        run: |
          set -o pipefail
          docker buildx build \
            --progress=plain \
            --push \
            --no-cache \
            --file Dockerfile.runpod \
            --tag ghcr.io/navalgazing/splatbot-runpod:latest \
            . 2>&1 | tee /tmp/runpod-image-build.log
      - name: Summarize Docker build failure
        if: failure()
        run: |
          {
            echo "### Docker build failure"
            echo
            echo '```text'
            tail -n 180 /tmp/runpod-image-build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
